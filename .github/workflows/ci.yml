name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (incluye reglas de capas)
        run: npm run lint

      - name: Build (genera tipos de Next.js)
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test